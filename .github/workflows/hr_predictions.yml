# .github/workflows/hr_predictions.yml

name: ⚾ HR Predictions

on:
  schedule:
    - cron: "30 15 * * *"   # 11:30 AM ET daily

  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date (YYYY-MM-DD or 'today')"
        required: false
        default: "today"
        type: string
      top_n:
        description: "Number of predictions per section"
        required: false
        default: "35"
        type: string
      dry_run:
        description: "Predict but don't send email"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  workflow_call:
    inputs:
      date:
        type: string
        default: "today"
      top_n:
        type: string
        default: "35"
      dry_run:
        type: string
        default: "false"
    secrets:
      EMAIL_SENDER:
        required: true
      EMAIL_PASSWORD:
        required: true
      EMAIL_RECIPIENTS:
        required: true
      OPENWEATHER_API_KEY:
        required: true

jobs:
  predict-and-send:
    name: Generate & Send MLB Predictions
    runs-on: ubuntu-latest
    timeout-minutes: 20   # reduced from 30 — pipeline now runs in ~5-8 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"           # caches pip deps between runs (~2 min → ~20s)

      - name: Install dependencies
        run: |
          pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      # NOTE: pybaseball cache removed — we no longer use pybaseball.
      # Statcast data is now fetched directly from Baseball Savant CSVs.

      - name: Resolve inputs
        id: resolve
        run: |
          DATE="${{ github.event.inputs.date || inputs.date || 'today' }}"
          TOP_N="${{ github.event.inputs.top_n || inputs.top_n || '35' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || inputs.dry_run || 'false' }}"
          echo "date=${DATE}"   >> $GITHUB_OUTPUT
          echo "top_n=${TOP_N}" >> $GITHUB_OUTPUT
          echo "dry_run=${DRY_RUN}" >> $GITHUB_OUTPUT
          echo "📅 Date: ${DATE} | Top N: ${TOP_N} | Dry run: ${DRY_RUN}"

      - name: Run prediction pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          EMAIL_SENDER:        ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:      ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENTS:    ${{ secrets.EMAIL_RECIPIENTS }}
          PREDICT_DATE:        ${{ steps.resolve.outputs.date }}
          TOP_N:               ${{ steps.resolve.outputs.top_n }}
        run: |
          DRY_FLAG=""
          if [ "${{ steps.resolve.outputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python main.py \
            --date "${{ steps.resolve.outputs.date }}" \
            --top-n "${{ steps.resolve.outputs.top_n }}" \
            $DRY_FLAG

      - name: Notify on failure
        if: failure()
        run: echo "::error::MLB prediction pipeline failed."
